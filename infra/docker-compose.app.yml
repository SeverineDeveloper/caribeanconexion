# Una instancia de la plataforma (production o staging) en el VPS.
# Uso:  docker compose -p cc-production --env-file /srv/cc/production.env -f infra/docker-compose.app.yml up -d
# Caddy (infra/caddy) publica cada web por la red "edge" con el alias web-<APP_ENV>.
name: cc-${APP_ENV:?APP_ENV requerido (production|staging)}

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
  NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-18296313468}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${APP_ENV}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  migrate:
    image: ${REGISTRY:?}/cc-migrate:${TAG:?}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    logging: *logging

  web:
    image: ${REGISTRY}/cc-web:${TAG}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks:
      default: {}
      edge:
        aliases: ["web-${APP_ENV}"]
    logging: *logging

  worker:
    image: ${REGISTRY}/cc-worker:${TAG}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging

  # Backup bajo demanda: lo lanza el cron del host (ver infra/README.md).
  backup:
    build: ./backup
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      APP_ENV: ${APP_ENV}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-cc-backups}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:

networks:
  edge:
    external: true
