# Servicios para desarrollo local. Producción: infra/docker-compose.prod.yml
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: cc
      POSTGRES_DB: conexion_caribe
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc -d conexion_caribe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
