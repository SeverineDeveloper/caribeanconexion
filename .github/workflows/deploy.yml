name: Deploy

# main → staging automático. Producción: lanzar a mano eligiendo "production".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Variables y secretos por entorno en GitHub → Settings → Environments.
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
      packages: write
    env:
      APP_ENV: ${{ inputs.environment || 'staging' }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ inputs.environment || 'staging' }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/cc-web:${{ env.TAG }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.WHATSAPP_NUMBER }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/cc-worker:${{ env.TAG }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build & push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/migrate.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/cc-migrate:${{ env.TAG }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          rsync -az --delete infra/ "$TARGET:/srv/cc/app/infra/"
          ssh "$TARGET" "cd /srv/cc/app && \
            export APP_ENV=$APP_ENV REGISTRY=$REGISTRY TAG=$TAG && \
            docker compose --env-file /srv/cc/$APP_ENV.env -f infra/docker-compose.app.yml pull && \
            docker compose --env-file /srv/cc/$APP_ENV.env -f infra/docker-compose.app.yml up -d --remove-orphans && \
            docker image prune -f"
